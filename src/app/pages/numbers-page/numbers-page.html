<section class="mx-5">

  <h1 class="text-3xl font-bold">Number Pipes</h1>
  <h3 class="text-2xl" >Built-in Angular number pipes</h3>

</section>



<div class="stats stats-vertical lg:stats-horizontal shadow w-full">
  <div class="stat">
    <div class="stat-title">Number:'1.2-2'</div>
    <div class="stat-value">{{ totalSells() | number:'1.2-2' }}</div>
    <div class="stat-desc">{{totalSells()}}</div>
  </div>

  <div class="stat">
    <div class="stat-title">Currency Pipe</div>
    <div class="stat-value">{{ totalSells() | currency:'EUR': 'symbol': '1.2-2' }}</div>
    <div class="stat-desc">{{totalSells()}}</div>
  </div>

  <div class="stat">
    <div class="stat-title">Percentage Pipe</div>
    <div class="stat-value">{{percent() | percent: '1.2-2' }}</div>
    <div class="stat-desc">{{percent()}}</div>
  </div>
</div>
